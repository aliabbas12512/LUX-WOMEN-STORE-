<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1080px;height:1920px;position:relative;overflow:hidden}
.layer{position:absolute;inset:0;overflow:hidden}
.layer img{will-change:transform}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,14,12,.65) 0%,rgba(15,14,12,0) 20%,rgba(15,14,12,0) 48%,rgba(15,14,12,.85) 72%,#0f0e0c 92%)}
.frame{position:absolute;inset:36px;border:1.5px solid rgba(217,195,154,.45);border-radius:28px;pointer-events:none}
.mark{position:absolute;top:150px;left:110px}.mark .ar{font-size:104px}.mark .en{font-size:24px;margin-top:8px}
.txt{position:absolute;right:92px;left:92px;top:1200px;text-align:right}
.eyebrow{color:var(--gold);font-size:30px;font-weight:500}
h1{font-family:"Amiri",serif;font-weight:400;font-size:112px;line-height:1.12;margin-top:12px}
h2{font-family:"Amiri",serif;font-weight:400;font-size:82px;line-height:1.2;margin-top:12px}
.price{font-family:"Amiri",serif;font-weight:700;color:var(--gold);font-size:84px;margin-top:18px}
.sub{font-size:34px;color:rgba(250,247,242,.8);margin-top:20px;font-weight:300}
.count{position:absolute;top:170px;right:100px;font-family:"Cormorant Garamond",serif;font-size:34px;letter-spacing:.2em;color:var(--gold);direction:ltr}
.end{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#2a241c 0%,#0f0e0c 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end .ar{font-size:230px}.end .en{font-size:44px;margin-top:18px}
.end .tag{font-size:38px;color:rgba(250,247,242,.8);margin-top:60px;font-weight:300}
.cta{background:var(--ivory);color:var(--ink);padding:30px 56px;font-size:40px;font-weight:600;margin-top:64px}
.cta svg{width:48px;height:48px;color:#1f7a4d}
.ph{font-size:40px;letter-spacing:.08em;direction:ltr;margin-top:36px;color:var(--ivory)}
.from{font-size:32px;color:var(--gold);margin-top:22px}
</style></head><body>
<div id="hero" class="layer"><img class="cover" src="../../public/hero-pearl-abaya.jpg" style="object-position:50% 20%"><div class="shade"></div></div>
<div id="slides"></div>
<div id="mark" class="mark wordmark"><span class="ar">لُكس</span><span class="en">LUX</span></div>
<div id="tA" class="txt"><p class="eyebrow">مجموعة الموسم الجديد</p><h1>أناقتكِ تبدأ من هنا</h1><p class="sub">عبايات مختارة بعناية لكل مناسبة</p></div>
<div id="tB" class="txt"><p class="eyebrow">قطعة الموسم</p><h2>عباية بحواف لؤلؤية</h2><p class="price">134 ر.س</p></div>
<div id="count" class="count"></div>
<div id="end" class="end">
  <div class="wordmark"><span class="ar">لُكس</span><span class="en">LUX</span></div>
  <div id="line" class="hairline" style="width:420px;margin-top:56px"></div>
  <p class="tag">عبايات فاخرة · توصيل داخل المملكة</p>
  <div class="pill cta"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm4.52 11.99c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.43-.06-.13-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.29Z"/></svg>اطلبي الآن عبر واتساب</div>
  <p class="ph">050 820 2459</p>
  <p class="from">التشكيلة ابتداءً من 125 ر.س</p>
</div>
<div class="frame"></div>
<script>
const P=[
 ["abaya-navy-floral-embroidery-1.jpg","عباية كحلية بتطريز الورود","134 ر.س"],
 ["abaya-green-ombre-cardigan-1.jpg","عباية بتدرّج الأخضر","133 ر.س"],
 ["abaya-lilac-floral-applique-1.jpg","عباية ليلكية بزهور على الأكتاف","177 ر.س"],
 ["abaya-black-tiered-lace-hem-1.jpg","عباية سوداء بحافة دانتيل","159 ر.س"],
];
const slides=document.getElementById("slides");
P.forEach(([src,n,p],i)=>{const d=document.createElement("div");d.className="layer";d.id="s"+i;
 d.innerHTML=`<img class="cover" src="../../public/products/${src}" style="object-position:50% 25%"><div class="shade"></div><div class="txt"><p class="eyebrow">وصل حديثاً</p><h2>${n}</h2><p class="price">${p}</p></div>`;slides.appendChild(d);});
const clamp=(x)=>Math.max(0,Math.min(1,x));
const ease=(x)=>1-Math.pow(1-clamp(x),3);
// fade in over [a,b], fade out over [c,d]
const vis=(t,a,b,c,d)=>Math.min(ease((t-a)/(b-a)), d===undefined?1:1-ease((t-c)/(d-c)));
function set(el,o,dy=0,s=1){el.style.opacity=o;el.style.transform=`translateY(${dy}px) scale(${s})`;}
const S0=5.4, SL=1.6, XF=0.35, END=S0+P.length*SL;
window.DURATION=15;
window.render=(t)=>{
 const hero=document.getElementById("hero");
 hero.style.opacity=1-ease((t-(S0-0.2))/XF);
 hero.querySelector("img").style.transform=`scale(${1.14-0.14*ease(t/5.6)})`;
 const m=document.getElementById("mark"); const mo=vis(t,0.3,1.2,END-0.3,END+0.1); set(m,mo,(1-ease((t-0.3)/0.9))*-20);
 const a=vis(t,0.8,1.7,2.9,3.3); set(document.getElementById("tA"),a,(1-ease((t-0.8)/0.9))*40);
 const b=vis(t,3.4,4.1,S0-0.4,S0); set(document.getElementById("tB"),b,(1-ease((t-3.4)/0.7))*40);
 P.forEach((_,i)=>{const st=S0+i*SL, el=document.getElementById("s"+i);
   const o=Math.min(ease((t-st+0.2)/XF), i===P.length-1? 1-ease((t-END+0.1)/0.5) : 1-ease((t-(st+SL-0.2))/XF));
   el.style.opacity=Math.max(0,o);
   el.querySelector("img").style.transform=`scale(${1.1-0.1*clamp((t-st+0.2)/(SL+0.4))})`;
   const tx=el.querySelector(".txt"); set(tx,clamp((t-st)/0.4),(1-ease((t-st)/0.5))*30);
 });
 const ci=Math.floor((t-S0)/SL); const c=document.getElementById("count");
 c.textContent= (t>=S0 && ci<P.length)? `0${ci+1} / 0${P.length}`:""; c.style.opacity=vis(t,S0,S0+0.4,END-0.3,END);
 const e=document.getElementById("end"); e.style.opacity=ease((t-END)/0.5);
 e.querySelector(".wordmark").style.transform=`scale(${0.92+0.08*ease((t-END)/1.2)})`;
 document.getElementById("line").style.width=(420*ease((t-END-0.4)/0.8))+"px";
 [...e.querySelectorAll(".tag,.cta,.ph,.from")].forEach((el,i)=>set(el,ease((t-END-0.6-i*0.18)/0.5),(1-ease((t-END-0.6-i*0.18)/0.5))*24));
};
render(0);
</script>
</body></html>
