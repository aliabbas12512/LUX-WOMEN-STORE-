<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--ink);padding:64px 64px 0}
header{display:flex;align-items:flex-end;justify-content:space-between}
header .ar{font-size:84px}header .en{font-size:20px;margin-top:6px}
header .t{text-align:right}
header .t p{color:var(--gold);font-size:24px;font-weight:500}
header .t h1{font-family:"Amiri",serif;font-weight:400;font-size:66px;line-height:1.15;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
.card{position:relative;height:430px;border-radius:22px;overflow:hidden;background:#222}
.card img{object-position:50% 22%}
.card .lbl{position:absolute;inset:auto 0 0 0;padding:70px 24px 20px;background:linear-gradient(to top,rgba(15,14,12,.88),rgba(15,14,12,0));display:flex;justify-content:space-between;align-items:flex-end}
.card .n{font-size:25px;font-weight:500;max-width:62%;line-height:1.35}
.card .p{font-family:"Amiri",serif;font-weight:700;font-size:40px;color:var(--gold);white-space:nowrap}
footer{display:flex;align-items:center;justify-content:space-between;margin-top:36px}
.cta{background:var(--ivory);color:var(--ink);padding:22px 40px;font-size:30px;font-weight:600}
.cta svg{width:36px;height:36px;color:#1f7a4d}
footer .ph{font-size:28px;direction:ltr;color:rgba(250,247,242,.8);letter-spacing:.06em}
</style></head><body>

  <div class="t"><p>وصل حديثاً</p><h1>عبايات لكل لحظة</h1></div>

</header>
<div class="grid">

  <div class="card"><img class="cover" src="../../public/products/abaya-green-ombre-cardigan-1.jpg"><div class="lbl"><span class="n">عباية بتدرّج الأخضر</span><span class="p">133 ر.س</span></div></div>
  <div class="card"><img class="cover" src="../../public/products/abaya-lilac-floral-applique-1.jpg"><div class="lbl"><span class="n">عباية ليلكية بزهور على الأكتاف</span><span class="p">177 ر.س</span></div></div>
  <div class="card"><img class="cover" src="../../public/products/abaya-black-tiered-lace-hem-1.jpg"><div class="lbl"><span class="n">عباية سوداء بحافة دانتيل</span><span class="p">159 ر.س</span></div></div>
